name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest black
      - name: Validate repository structure
        run: python scripts/validate.py
      - name: Run Python tests
        run: pytest -q
      - name: Lint (black)
        run: bash scripts/lint.sh

  c-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: clang-format-16
          version: 1.0
      - name: Expose clang-format 16 as clang-format
        run: sudo ln -sf /usr/bin/clang-format-16 /usr/bin/clang-format
      - name: Assert clang-format is installed and runnable
        run: |
          set -euo pipefail
          test -x /usr/bin/clang-format-16
          command -v clang-format
          clang-format --version
      - name: Compile and run C tests
        run: |
          set -euo pipefail
          for t in $(git ls-files '**/test_*.c'); do
            out="/tmp/$(basename "$t" .c)"
            gcc -std=c11 -Wall -Wextra "$t" -o "$out"
            "$out"
          done
      - name: Compile and run C++ tests
        run: |
          set -euo pipefail
          for t in $(git ls-files '**/test_*.cpp'); do
            out="/tmp/$(basename "$t" .cpp)"
            g++ -std=c++17 -Wall -Wextra "$t" -o "$out"
            "$out"
          done
      - name: Validate repository structure
        run: python3 scripts/validate.py
      - name: Lint (clang-format)
        run: bash scripts/lint.sh

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install google-java-format (pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/google-java-format.jar \
            https://repo1.maven.org/maven2/com/google/googlejavaformat/google-java-format/1.25.2/google-java-format-1.25.2-all-deps.jar
          printf '#!/usr/bin/env bash\nexec java -jar /tmp/google-java-format.jar "$@"\n' \
            | sudo tee /usr/local/bin/google-java-format >/dev/null
          sudo chmod +x /usr/local/bin/google-java-format
      - name: Compile Java tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/classes
          for d in $(git ls-files '**/Test*.java' | xargs -r -n1 dirname | sort -u); do
            javac -d /tmp/classes "$d"/*.java
          done
      - name: Run Java tests
        run: |
          set -euo pipefail
          for t in $(git ls-files '**/Test*.java'); do
            cls=$(basename "$t" .java)
            java -cp /tmp/classes "$cls"
          done
      - name: Validate repository structure
        run: python3 scripts/validate.py
      - name: Lint (google-java-format)
        run: bash scripts/lint.sh
